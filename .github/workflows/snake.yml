name: regenerate profile graphics
on:
  schedule:
    - cron: "0 3 * * *"   # rebuilds itself nightly
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # stat panels first: if the API is down this fails the job and
      # yesterday's graphics keep serving — never deploy broken cards
      - name: generate stat panels
        run: python3 scripts/gen_stats.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: hassan09070
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#e8ff47
            dist/snake-light.svg?palette=github-light
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
